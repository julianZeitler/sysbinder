model:
  image_size: 128
  image_channels: 3
  num_iterations: 3
  num_slots: 4
  num_blocks: 8
  cnn_hidden_size: 64
  slot_size: 256
  mlp_hidden_size: 64
  num_prototypes: 16
  vocab_size: 512
  num_decoder_layers: 2
  num_decoder_heads: 4
  d_model: 64
  dropout: 0.1

train:
  batch_size: 8
  epochs: 1
  lr_dvae: 3.0e-4
  lr_enc: 1.0e-4
  lr_dec: 3.0e-4
  lr_warmup_steps: 10
  lr_half_life: 1000
  clip: 0.05
  tau_start: 1.0
  tau_final: 0.1
  tau_steps: 10
  use_dp: false
  sigreg_weight: 1.0e-3
  sigreg_num_slices: 512
