# CLEVR-Easy run config.
# Differs from configs/default.yaml: slot_size 2048 -> 256, epochs 500 -> 100.

model:
  image_size: 128
  image_channels: 3

  num_iterations: 3
  num_slots: 4
  num_blocks: 8
  cnn_hidden_size: 512
  slot_size: 256
  mlp_hidden_size: 192
  num_prototypes: 64

  vocab_size: 4096
  num_decoder_layers: 8
  num_decoder_heads: 4
  d_model: 192
  dropout: 0.1

train:
  batch_size: 40
  epochs: 100

  lr_dvae: 3.0e-4
  lr_enc: 1.0e-4
  lr_dec: 3.0e-4
  lr_warmup_steps: 30000
  lr_half_life: 250000
  clip: 0.05

  tau_start: 1.0
  tau_final: 0.1
  tau_steps: 30000

  use_dp: true
